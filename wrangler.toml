name = "nhlmc"
pages_build_output_dir = "dist"
compatibility_date = "2026-10-18"
compatibility_flags = ["nodejs_compat"]

# Cloudflare D1 Database Binding for Cloudflare Pages
# In Cloudflare Dashboard: Pages -> nhlmc -> Settings -> Functions -> D1 Database Bindings
# Bind 'DB' to 'nhlmc-db'
[[d1_databases]]
binding = "DB"
database_name = "nhlmc-db"
database_id = "nhlmc-db"
migrations_dir = "./migrations"
