name: Update NHL Data & Projections

on:
  schedule:
    # Run every morning at 06:00 UTC (02:00 AM EDT)
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run NHL data ingestion script
        run: node scripts/fetch-all-nhl-data.mjs

      - name: Commit and push updated dataset
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/nhlPlayers.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(data): automated daily NHL stats & projections update" && git push)
