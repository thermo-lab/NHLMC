name: Nightly NHL Data Sync
# Automatically triggers every morning at 4:00 AM EST (09:00 UTC)
# Calls the Cloudflare Pages D1 sync endpoint to refresh standings and player stats.

on:
  schedule:
    - cron: '0 9 * * *' # Every day at 09:00 UTC (4:00 AM EST)
  workflow_dispatch:     # Allows manual trigger from GitHub Actions tab

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Cloudflare Pages D1 Sync
        run: |
          echo "Triggering Cloudflare Pages D1 Sync endpoint..."
          RESPONSE=$(curl -s -X POST https://nhlmc.pages.dev/api/sync \
            -H "Content-Type: application/json" \
            -H "User-Agent: GitHub-Actions-Nightly-Sync/1.0")
          echo "Response: $RESPONSE"
